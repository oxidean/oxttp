name: ci

on:
  push:
    branches: [main]
  pull_request:
    # edited re-fires the gate on title/body changes — otherwise a
    # post-green metadata edit could land attribution unchecked.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  build:
    name: oxl-build
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # PR code runs here; don't leave a token in git config

      - name: install oxl toolchain
        run: |
          OXL_VERSION=$(cat .oxl-version)
          curl -fsSL -o /tmp/oxl.tar.gz \
            "https://github.com/oxidean/oxl/releases/download/v${OXL_VERSION}/oxl-toolchain-linux-x86_64.tar.gz"
          mkdir -p /tmp/oxl-toolchain
          tar -xzf /tmp/oxl.tar.gz -C /tmp/oxl-toolchain --strip-components=1
          echo "/tmp/oxl-toolchain" >> "$GITHUB_PATH"
          /tmp/oxl-toolchain/oxl version

      # The TUI compile peaks far above the hosted runner's memory
      # ceiling (oxidean/oxl#232). Give the build leg the same transient
      # swap headroom as the test matrix; keep the path distinct from the
      # hosted image's active /swapfile.
      - name: add swap for oxl build memory peak
        run: |
          cur_kb=$(awk '/^SwapTotal/ {print $2}' /proc/meminfo)
          mem_kb=$(awk '/^MemTotal/ {print $2}' /proc/meminfo)
          want_kb=$((40 * 1024 * 1024 - mem_kb - cur_kb))
          avail_kb=$(df -k --output=avail / | tail -1)
          disk_kb=$((avail_kb - 3 * 1024 * 1024))
          [ "$want_kb" -gt "$disk_kb" ] && want_kb=$disk_kb
          if [ "$want_kb" -gt 0 ]; then
            want_mb=$((want_kb / 1024))
            sudo fallocate -l "${want_mb}M" /oxttp-ci-swap || sudo dd if=/dev/zero of=/oxttp-ci-swap bs=1M count=$want_mb
            sudo chmod 600 /oxttp-ci-swap
            sudo mkswap /oxttp-ci-swap
            sudo swapon /oxttp-ci-swap
          fi
          free -h

      # oxl build emits binaries only for `package main` dirs; building
      # the two apps transitively compiles shared/ and core/.
      - name: build apps
        run: |
          oxl build ./cli -o /tmp/oxttp
          oxl build ./tui -o /tmp/oxttp-tui
          /tmp/oxttp --version
          timeout 10s /tmp/oxttp-tui </dev/null

  # `oxl test <pkg>` compiles every `_test.oxl` in the package's whole
  # dependency closure, not just the package's own tests. Running the
  # two app closures therefore duplicates the suite and compounds the
  # driver's memory peak (oxidean/oxl#232). Matrix each test-owning
  # package instead, and strip every other package's test files from
  # the checkout before compiling: each test still runs exactly once,
  # while the compiler only carries the target package's test variants.
  test:
    name: oxl-test-$suite
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite:
          - cli
          - core/capture
          - core/collection
          - core/config
          - core/env
          - core/http
          - core/importing
          - core/item
          - core/model
          - core/session
          - core/term
          - core/yaml
          - shared/args
          - tui
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # PR code runs here; don't leave a token in git config

      - name: install oxl toolchain
        run: |
          OXL_VERSION=$(cat .oxl-version)
          curl -fsSL -o /tmp/oxl.tar.gz \
            "https://github.com/oxidean/oxl/releases/download/v${OXL_VERSION}/oxl-toolchain-linux-x86_64.tar.gz"
          mkdir -p /tmp/oxl-toolchain
          tar -xzf /tmp/oxl.tar.gz -C /tmp/oxl-toolchain --strip-components=1
          echo "/tmp/oxl-toolchain" >> "$GITHUB_PATH"
          /tmp/oxl-toolchain/oxl version

      # Even with dependency tests stripped, the largest target suites
      # peak near the hosted runner's memory ceiling while the driver
      # retains compile state through test execution (oxidean/oxl#232).
      # Swap carries transient overflow until upstream fixes the driver's
      # memory profile. The hosted image already ships an active
      # /swapfile — writing to it fails ETXTBSY, so this one uses a
      # unique path sized to available disk.
      - name: add swap for oxl test memory peak
        run: |
          # The hosted image already ships an active /swapfile — writing
          # to it fails ETXTBSY, so this one uses a unique path. Size it
          # to the smaller of the memory headroom we want (~40GiB total
          # commit) and what the runner disk can spare (~3GiB kept free).
          cur_kb=$(awk '/^SwapTotal/ {print $2}' /proc/meminfo)
          mem_kb=$(awk '/^MemTotal/ {print $2}' /proc/meminfo)
          want_kb=$((40 * 1024 * 1024 - mem_kb - cur_kb))
          avail_kb=$(df -k --output=avail / | tail -1)
          disk_kb=$((avail_kb - 3 * 1024 * 1024))
          [ "$want_kb" -gt "$disk_kb" ] && want_kb=$disk_kb
          if [ "$want_kb" -gt 0 ]; then
            want_mb=$((want_kb / 1024))
            sudo fallocate -l "${want_mb}M" /oxttp-ci-swap || sudo dd if=/dev/zero of=/oxttp-ci-swap bs=1M count=$want_mb
            sudo chmod 600 /oxttp-ci-swap
            sudo mkswap /oxttp-ci-swap
            sudo swapon /oxttp-ci-swap
          fi
          free -h

      - name: test ${{ matrix.suite }}
        run: |
          target='${{ matrix.suite }}'
          while IFS= read -r f; do
            d=$(dirname "$f")
            if [ "$d" != "./$target" ]; then
              rm -- "$f"
            fi
          done < <(find . -type f -name '*_test.oxl')
          oxl test "./$target"

  # Commit-message gate (see scripts/commit-check.sh): SemVer-prefix
  # grammar on subjects + no-AI-attribution scan, on the PR's commit
  # range, its title, and its body.
  commit-lint:
    name: commit-lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: lint commit range (PR)
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/commit-check.sh --range "$PR_BASE..$PR_HEAD"

      - name: lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: scripts/commit-check.sh --pr-title "$PR_TITLE"

      - name: scan PR body for attribution markers
        # Bot-authored bodies (dependabot, renovate) are platform-
        # generated boilerplate — GitHub injects zero-width spaces into
        # @-mentions for anti-ping, which this scan exists to catch.
        # Not a human attribution surface; commits/title still lint.
        if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_BODY" > pr-body.txt
          # CodeRabbit owns the release-notes block it injects into the
          # description — exempt that managed section, scan the rest.
          # Count only the full HTML markers: a plain-text mention of
          # the phrase is not a block. Unbalanced pairs still fail —
          # a stray start marker could hide attribution after it.
          open_m='<!-- This is an auto-generated comment: release notes by coderabbit.ai -->'
          close_m='<!-- end of auto-generated comment: release notes by coderabbit.ai -->'
          # -oF counts occurrences, not matching lines — same-line
          # pairs would read as one open and one close to -c.
          opens=$(grep -oF "$open_m" pr-body.txt | wc -l || :)
          closes=$(grep -oF "$close_m" pr-body.txt | wc -l || :)
          if [ "$opens" != "$closes" ]; then
            echo "commit-check: unbalanced CodeRabbit release-notes markers in PR body" >&2
            exit 1
          fi
          # ordered, non-nesting extraction: drop each start→end pair
          # (markers included), keep every other byte — same-line text
          # around markers and unmatched/out-of-order markers verbatim.
          awk -v S="$open_m" -v E="$close_m" '
            { buf = buf $0 "\n" }
            END {
              out = ""; rest = buf
              while ((i = index(rest, S)) > 0) {
                tail = substr(rest, i + length(S))
                j = index(tail, E)
                if (j == 0) break
                out = out substr(rest, 1, i - 1)
                rest = substr(tail, j + length(E))
              }
              printf "%s", out rest
            }' pr-body.txt > pr-body-clean.txt
          # equal counts but wrong order leave markers behind in the
          # cleaned body — a stray open/close is not a managed block.
          if grep -qF "$open_m" pr-body-clean.txt || grep -qF "$close_m" pr-body-clean.txt; then
            echo "commit-check: misordered CodeRabbit release-notes markers in PR body" >&2
            exit 1
          fi
          scripts/commit-check.sh --scan-file pr-body-clean.txt
